<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<title>VibeDeck — Dev Observability</title>
<style>
  :root {
    --bg: #08070c;
    --bg2: #0b0912;
    --panel: #12101c;
    --panel2: #171426;
    --border: #241f38;
    --border2: #322a4d;
    --text: #e8e6f0;
    --muted: #8a86a3;
    --dim: #5f5b78;
    --accent: #c026d3;
    --accent2: #a855f7;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --grad: linear-gradient(135deg, #a855f7 0%, #c026d3 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 14px; line-height: 1.5; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2440; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a3355; }

  .app { display: grid; grid-template-columns: 238px 1fr 0px; height: 100vh; transition: grid-template-columns .22s ease; }
  .app.detail-open { grid-template-columns: 238px 1fr 460px; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 20px 18px 18px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .bname { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .btag { font-size: 9.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; margin-top: 1px; }
  nav { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .ngroup {
    font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); padding: 16px 10px 7px; font-weight: 700;
  }
  .nitem {
    display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 8px;
    color: var(--muted); font-size: 13.5px; cursor: pointer; user-select: none;
    border-left: 2px solid transparent; transition: background .12s, color .12s;
  }
  .nitem:hover { background: rgba(168,85,247,.07); color: var(--text); }
  .nitem.active { background: rgba(192,38,211,.13); color: #f0abfc; border-left-color: var(--accent); font-weight: 600; }
  .nitem .ni { width: 16px; text-align: center; font-size: 13px; opacity: .9; }
  .nitem .ncount {
    margin-left: auto; font-size: 10.5px; background: rgba(255,255,255,.06);
    border-radius: 20px; padding: 1px 7px; color: var(--muted);
  }
  .nitem .ncount.bad { background: rgba(239,68,68,.18); color: #fca5a5; }
  .sfoot { padding: 12px 18px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--dim); }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 26px; border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .vsub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .content { flex: 1; overflow-y: auto; padding: 24px 26px 60px; }

  /* ---------- Buttons ---------- */
  .btn {
    background: var(--grad); color: #fff; border: none; border-radius: 8px;
    padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: transform .12s, box-shadow .12s, opacity .12s; font-family: inherit;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.45); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { border-color: var(--accent2); box-shadow: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.sm { padding: 5px 11px; font-size: 12px; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 13px; margin-bottom: 26px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 15px 17px; cursor: pointer; transition: border-color .14s, transform .14s;
  }
  .stat:hover { border-color: var(--border2); transform: translateY(-2px); }
  .stat .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stat .val { font-size: 27px; font-weight: 700; margin-top: 5px; letter-spacing: -.5px; }
  .stat .val.ok { color: var(--ok); }
  .stat .val.warn { color: var(--warn); }
  .stat .val.err { color: var(--err); }
  .stat .val.acc { color: #e879f9; }
  .stat .hint { font-size: 11px; color: var(--dim); margin-top: 3px; }

  /* ---------- Sections ---------- */
  h2.sec {
    font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 12px; display: flex; align-items: center; gap: 9px;
  }
  h2.sec:first-child { margin-top: 0; }
  h2.sec .bar { width: 3px; height: 13px; border-radius: 2px; background: var(--grad); }
  h2.sec .cnt { font-size: 10.5px; background: rgba(255,255,255,.06); border-radius: 20px; padding: 1px 8px; color: var(--muted); letter-spacing: 0; }

  /* ---------- Panels / rows ---------- */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 11px 15px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(168,85,247,.06); }
  .row .ricon { font-size: 17px; width: 22px; text-align: center; }
  .row .rname { font-weight: 600; font-size: 13.5px; }
  .row .rsub { font-size: 11.5px; color: var(--muted); }
  .row .rpath {
    font-family: Consolas, "Cascadia Code", monospace; font-size: 11px; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  .row .rright { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .row .chev { color: var(--dim); font-size: 12px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }
  .dot.off { background: var(--dim); }

  .badge {
    font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
  }
  .badge.ok { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge.warn { background: rgba(245,158,11,.15); color: #fbbf24; }
  .badge.err { background: rgba(239,68,68,.15); color: #f87171; }
  .badge.loading { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .badge.kind { background: rgba(255,255,255,.06); color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 600; }
  .badge.kind.managed { background: rgba(168,85,247,.16); color: #d8b4fe; }
  .badge.kind.system { background: rgba(34,197,94,.14); color: #4ade80; }
  .badge.kind.npm-global { background: rgba(239,68,68,.14); color: #f87171; }
  .badge.kind.override { background: rgba(56,189,248,.14); color: #7dd3fc; }
  .badge.kind.notfound { background: rgba(239,68,68,.14); color: #f87171; }

  .tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 5px; margin-right: 5px; font-weight: 600; }
  .tag.ok { background: rgba(34,197,94,.15); color: #4ade80; }
  .tag.miss { background: rgba(239,68,68,.15); color: #f87171; }
  .tag.conflict { background: rgba(245,158,11,.15); color: #fbbf24; }
  .tag.npm { background: rgba(203,56,55,.2); color: #ff7b72; }
  .tag.pip { background: rgba(55,116,171,.2); color: #79c0ff; }
  .tag.uv { background: rgba(168,85,247,.2); color: #d8b4fe; }
  .mono { font-family: Consolas, "Cascadia Code", monospace; }
  .empty { color: var(--dim); font-size: 12.5px; font-style: italic; padding: 14px 15px; }

  /* ---------- Detail drawer ---------- */
  .detail {
    background: var(--bg2); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  }
  .dhead {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .dhead .dt { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 7px; width: 26px; height: 26px; cursor: pointer; font-size: 12px; flex-shrink: 0;
  }
  .x:hover { color: var(--text); border-color: var(--accent2); }
  .dbody { flex: 1; overflow-y: auto; padding: 18px; }
  .dbody .dsec { margin-bottom: 20px; }
  .dbody .dsec h4 {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 9px; font-weight: 700;
  }
  .kv { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); width: 92px; flex-shrink: 0; }
  .kv .v { flex: 1; word-break: break-all; }
  .issue-item {
    display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border-radius: 8px;
    background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.2);
    font-size: 12.5px; margin-bottom: 7px;
  }
  .issue-item.err { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.2); }
  .issue-item .ii { flex-shrink: 0; }
  .logs {
    background: #06050a; border: 1px solid var(--border); border-radius: 9px; padding: 11px;
    font-family: Consolas, "Cascadia Code", monospace; font-size: 11px;
    max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  .log-file { margin-bottom: 14px; }
  .log-file-label { color: #e879f9; font-weight: 600; margin-bottom: 5px; font-size: 11.5px; }
  .log-line { color: var(--muted); }
  .log-line.err { color: #f87171; }
  .log-line.warn { color: #fbbf24; }
  .cmd {
    font-family: Consolas, "Cascadia Code", monospace; font-size: 12px;
    background: #06050a; border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px;
    margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .cmd code { color: #e879f9; }
  .copy-btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 5px; padding: 3px 9px; font-size: 10.5px; cursor: pointer; flex-shrink: 0; font-family: inherit;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent2); }

  /* ---------- Project form ---------- */
  .hero { background: linear-gradient(160deg, var(--panel2) 0%, var(--panel) 100%); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .hero .lead { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .field-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    flex: 1; min-width: 250px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 13px; color: var(--text); font-size: 13px;
    font-family: Consolas, "Cascadia Code", monospace;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(168,85,247,.15); }
  .stack-picker { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 4px; }
  .stack-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: all .12s; font-family: inherit;
  }
  .stack-btn:hover { color: var(--text); border-color: var(--accent2); }
  .stack-btn.active { background: rgba(192,38,211,.15); color: #f0abfc; border-color: var(--accent); }
  .result { margin-top: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 11px; padding: 16px; display: none; }
  .result.visible { display: block; }
  .result h3 { font-size: 14px; font-weight: 700; margin-bottom: 11px; }
  .ok-line { color: #4ade80; font-size: 12.5px; margin-bottom: 9px; }
  .file-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 13px; }
  .file-chip {
    font-family: Consolas, monospace; font-size: 11.5px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px;
  }
  .file-chip.new { border-color: rgba(34,197,94,.4); color: #4ade80; }
  .cmd-block { margin-top: 12px; }
  .cmd-block .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .rec { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border-radius: 8px; margin-bottom: 7px; background: var(--panel2); border: 1px solid var(--border); }
  .rec .rtype { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
  .rtype.manager { background: rgba(168,85,247,.2); color: #d8b4fe; }
  .rtype.lockfile { background: rgba(245,158,11,.2); color: #fbbf24; }
  .rtype.conflict { background: rgba(239,68,68,.2); color: #f87171; }
  .rtype.no-stack { background: rgba(56,189,248,.2); color: #7dd3fc; }
  .rtype.gitignore { background: rgba(245,158,11,.2); color: #fbbf24; }
  .rec .msg { font-size: 12.5px; flex: 1; }
  .rec .act { font-family: Consolas, monospace; font-size: 11.5px; color: #e879f9; white-space: nowrap; }

  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border);
    border-top-color: var(--accent2); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-frame { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 10px; background: #fff; margin-top: 12px; }
  .link-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  a.link {
    color: #e879f9; text-decoration: none; font-size: 12.5px; border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; background: var(--panel2);
  }
  a.link:hover { border-color: var(--accent2); }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <div class="bname">VibeDeck</div>
        <div class="btag">Dev Observability</div>
      </div>
    </div>
    <nav id="nav">
      <div class="ngroup">Observability</div>
      <div class="nitem active" data-view="overview"><span class="ni">◫</span>Vue d'ensemble</div>
      <div class="nitem" data-view="tools"><span class="ni">⚙</span>Outils<span class="ncount" id="nc-tools"></span></div>
      <div class="nitem" data-view="diagnostics"><span class="ni">◈</span>Diagnostics<span class="ncount" id="nc-diag"></span></div>
      <div class="ngroup">Projet</div>
      <div class="nitem" data-view="project"><span class="ni">▤</span>Init + Doctor</div>
      <div class="nitem" data-view="visuals"><span class="ni">◐</span>Visuels</div>
    </nav>
    <div class="sfoot">v1.0 · localhost:8787</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Vue d'ensemble</h1>
        <div class="vsub" id="viewSub">Santé des outils et de l'environnement</div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="refreshView()">↻ Rafraîchir</button>
        <button class="btn" onclick="captureAll()">⤓ Tout capturer</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <aside class="detail" id="detail">
    <div class="dhead">
      <span class="dt" id="dTitle">Détail</span>
      <button class="x" onclick="closeDetail()">✕</button>
    </div>
    <div class="dbody" id="dBody"></div>
  </aside>

</div>

<script>
const TOOLS = [
  { id: 'claude', name: 'Claude Code', icon: '🤖' },
  { id: 'antigravity', name: 'Antigravity', icon: '🛰️' },
  { id: 'copilot', name: 'GitHub Copilot', icon: '🐙' },
  { id: 'cursor', name: 'Cursor', icon: '🖱️' }
];

const VIEWS = {
  overview:    { title: "Vue d'ensemble", sub: "Santé des outils et de l'environnement" },
  tools:       { title: "Outils",         sub: "Santé, logs et résolution des binaires" },
  diagnostics: { title: "Diagnostics",    sub: "PATH, conflits shell, skills, mises à jour" },
  project:     { title: "Init + Doctor",  sub: "Initialise ou diagnostique un dossier de projet" },
  visuals:     { title: "Visuels",        sub: "Génère architecture + kanban dans le projet" }
};

const state = { view: 'overview', overview: null, registry: null, diag: null, selectedStack: 'auto' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function badge(status) {
  const label = { ok: 'OK', warn: 'Attention', err: 'Erreur', loading: '…' };
  return `<span class="badge ${status}">${label[status] || '…'}</span>`;
}
function classify(line) {
  if (/(error|critical|fatal|exception|failed|crash)/i.test(line)) return 'err';
  if (/(warn|warning)/i.test(line)) return 'warn';
  return '';
}
function kindBadge(kind) {
  const cls = kind === 'not found' ? 'notfound' : kind;
  return `<span class="badge kind ${cls}">${esc(kind)}</span>`;
}

/* ---------- Navigation ---------- */
document.getElementById('nav').addEventListener('click', e => {
  const item = e.target.closest('.nitem');
  if (item) setView(item.dataset.view);
});

function setView(v) {
  state.view = v;
  document.querySelectorAll('.nitem').forEach(n => n.classList.toggle('active', n.dataset.view === v));
  document.getElementById('viewTitle').textContent = VIEWS[v].title;
  document.getElementById('viewSub').textContent = VIEWS[v].sub;
  closeDetail();
  render();
}

function refreshView() {
  if (state.view === 'overview') { state.overview = null; }
  if (state.view === 'tools') { state.registry = null; }
  if (state.view === 'diagnostics') { state.diag = null; }
  render();
}

/* ---------- Detail drawer ---------- */
function openDetail(title, html) {
  document.getElementById('dTitle').textContent = title;
  document.getElementById('dBody').innerHTML = html;
  document.getElementById('app').classList.add('detail-open');
}
function closeDetail() {
  document.getElementById('app').classList.remove('detail-open');
}

/* ---------- Render dispatch ---------- */
function render() {
  const c = document.getElementById('content');
  if (state.view === 'overview') return renderOverview(c);
  if (state.view === 'tools') return renderTools(c);
  if (state.view === 'diagnostics') return renderDiagnostics(c);
  if (state.view === 'project') return renderProject(c);
  if (state.view === 'visuals') return renderVisuals(c);
}

/* ================= OVERVIEW ================= */
async function renderOverview(c) {
  if (!state.overview) {
    c.innerHTML = '<div class="empty"><span class="spinner"></span> Analyse de l\'environnement…</div>';
    try {
      const r = await fetch('/api/overview');
      state.overview = await r.json();
    } catch (e) {
      c.innerHTML = `<div class="empty">Erreur: ${esc(e.message)}</div>`;
      return;
    }
  }
  const o = state.overview;
  const warnTools = o.tools.filter(t => t.status !== 'ok');
  const totalIssues = o.tools.reduce((n, t) => n + (t.issues ? t.issues.length : 0), 0);

  document.getElementById('nc-tools').textContent = warnTools.length || '';
  document.getElementById('nc-tools').className = 'ncount' + (warnTools.length ? ' bad' : '');
  const diagBad = o.pathMissing + o.conflicts + o.skillsEmpty;
  document.getElementById('nc-diag').textContent = diagBad || '';
  document.getElementById('nc-diag').className = 'ncount' + (diagBad ? ' bad' : '');

  const stats = `
    <div class="stats">
      <div class="stat" onclick="setView('tools')">
        <div class="lbl">Outils</div>
        <div class="val ${warnTools.length ? 'warn' : 'ok'}">${o.tools.length - warnTools.length}/${o.tools.length}</div>
        <div class="hint">${warnTools.length ? warnTools.length + ' à surveiller' : 'tous opérationnels'}</div>
      </div>
      <div class="stat" onclick="setView('diagnostics')">
        <div class="lbl">PATH manquants</div>
        <div class="val ${o.pathMissing ? 'err' : 'ok'}">${o.pathMissing}</div>
        <div class="hint">sur ${o.pathTotal} binaires</div>
      </div>
      <div class="stat" onclick="setView('diagnostics')">
        <div class="lbl">Conflits shell</div>
        <div class="val ${o.conflicts ? 'warn' : 'ok'}">${o.conflicts}</div>
        <div class="hint">doublons sur le PATH</div>
      </div>
      <div class="stat" onclick="setView('diagnostics')">
        <div class="lbl">Skills vides</div>
        <div class="val ${o.skillsEmpty ? 'warn' : 'ok'}">${o.skillsEmpty}</div>
        <div class="hint">sur ${o.skillsTotal} dossiers</div>
      </div>
      <div class="stat" onclick="setView('tools')">
        <div class="lbl">Problèmes</div>
        <div class="val ${totalIssues ? 'err' : 'ok'}">${totalIssues}</div>
        <div class="hint">signalés par les outils</div>
      </div>
    </div>`;

  const toolRows = o.tools.map(t => `
    <div class="row" onclick="openToolDetail('${t.id}')">
      <span class="dot ${t.status === 'ok' ? 'ok' : t.status === 'warn' ? 'warn' : 'err'}"></span>
      <span class="ricon">${t.icon}</span>
      <div>
        <div class="rname">${esc(t.name)}</div>
        <div class="rsub">${t.running ? 'en cours' : 'arrêté'}${t.issues && t.issues.length ? ' · ' + t.issues.length + ' problème(s)' : ''}</div>
      </div>
      <div class="rright">${badge(t.status)}<span class="chev">›</span></div>
    </div>`).join('');

  const attention = [];
  for (const t of o.tools) for (const i of (t.issues || [])) attention.push({ src: t.name, icon: t.icon, msg: i, tool: t.id });
  const attRows = attention.length
    ? attention.map(a => `
      <div class="row" onclick="openToolDetail('${a.tool}')">
        <span class="ricon">${a.icon}</span>
        <div><div class="rname">${esc(a.msg)}</div><div class="rsub">${esc(a.src)}</div></div>
        <div class="rright"><span class="chev">›</span></div>

    `<h2 class="sec"><span class="bar"></span>Santé des outils<span class="cnt">${o.tools.length}</span></h2>
     <div class="panel">${toolRows}</div>
     <h2 class="sec"><span class="bar"></span>Points d'attention<span class="cnt">${attention.length}</span></h2>
     <div class="panel">${attRows}</div>`;
}

async function renderTools(c) {
  if (!state.registry) {
    c.innerHTML = '<div class="empty"><span class="spinner"></span> Résolution des binaires…</div>';
    try {
      const [tr, rr] = await Promise.all([fetch('/api/tools'), fetch('/api/tools/registry')]);
      state.overview = state.overview || {};
      state.overview.tools = await tr.json();
      state.registry = await rr.json();
    } catch (e) {
      c.innerHTML = `<div class="empty">Erreur: ${esc(e.message)}</div>`;
      return;
    }
  }
  const toolList = (state.overview && state.overview.tools) || [];
  const reg = state.registry || [];
  const missing = reg.filter(r => !r.ok);

  const healthRows = toolList.map(t => `
    <div class="row" onclick="openToolDetail('${t.id}')">
      <span class="dot ${t.status === 'ok' ? 'ok' : t.status === 'warn' ? 'warn' : 'err'}"></span>
      <span class="ricon">${t.icon}</span>
      <div>
        <div class="rname">${esc(t.name)}</div>
        <div class="rsub">${t.running ? 'en cours' : 'arrêté'}${t.issues && t.issues.length ? ' · ' + t.issues.join(' · ') : ''}</div>
      </div>
      <div class="rright">${badge(t.status)}<span class="chev">›</span></div>

    <div class="row" onclick="openRegistryDetail('${esc(r.name)}')">
      <span class="ricon" style="font-size:13px">${r.ok ? '✓' : '✗'}</span>
      <div style="width:110px;flex-shrink:0"><div class="rname">${esc(r.name)}</div></div>
      <div style="width:96px;flex-shrink:0">${kindBadge(r.kind)}</div>

async function openToolDetail(id) {
  const t = TOOLS.find(x => x.id === id) || { name: id, icon: '⚙' };
  openDetail(t.name, '<div class="empty"><span class="spinner"></span> Capture des logs…</div>');
  try {
    const r = await fetch(`/api/logs?tool=${id}`);
    const d = await r.json();
    const issues = (d.issues || []).length
      ? d.issues.map(i => `<div class="issue-item"><span class="ii">⚠</span><span>${esc(i)}</span></div>`).join('')
      : '<div class="ok-line">✓ Aucun problème détecté</div>';
    const files = (d.files || []).length
      ? d.files.map(f => `
        <div class="log-file">
          <div class="log-file-label">${esc(f.label)}</div>
          ${(f.lines || []).map(l => `<div class="log-line ${classify(l)}">${esc(l)}</div>`).join('')}
        </div>`).join('')
      : '<div class="empty">Aucun log disponible.</div>';
    openDetail(t.name, `
      <div class="dsec"><h4>Statut</h4>${badge(d.status)}</div>
      <div class="dsec"><h4>Problèmes</h4>${issues}</div>

    openDetail(t.name, `<div class="empty">Erreur: ${esc(e.message)}</div>`);
  }
}

function selectStack(s) {
  state.selectedStack = s;
  document.querySelectorAll('.stack-btn').forEach(b => b.classList.toggle('active', b.dataset.stack === s));
}
function projPath() { return (document.getElementById('projPath') || {}).value ? document.getElementById('projPath').value.trim() : ''; }
function showResult(html) {
  const el = document.getElementById('projResult');
  el.innerHTML = html;
  el.classList.add('visible');
}
function setBusy(btnId, busy, label) {
  const b = document.getElementById(btnId);
  if (!b) return;
  if (busy) { b.disabled = true; b.dataset.orig = b.innerHTML; b.innerHTML = `<span class="spinner"></span> ${label}`; }
  else { b.disabled = false; b.innerHTML = b.dataset.orig || b.innerHTML; }
}

async function detectStack() {
  const p = projPath();
  if (!p) { showResult('<div class="empty">Entre un chemin de dossier d\'abord.</div>'); return; }
  setBusy('detectBtn', true, 'Détection…');
  try {
    const res = await fetch(`/api/project/detect?path=${encodeURIComponent(p)}`);
    const d = await res.json();
    if (d.stack) {
      selectStack(d.stack.id);
      showResult(`<h3>${d.stack.icon} Stack détectée : ${esc(d.stack.label)}</h3>
        <div class="ok-line">✓ Sélectionnée automatiquement. Clique « Initialiser » ou « Diagnostiquer ».</div>`);
    } else {
      selectStack('auto');
      showResult('<h3>🤖 Aucune stack détectée</h3><div class="empty">Le dossier est vide ou inconnu. Choisis une stack et clique « Initialiser ».</div>');
    }
  } catch (e) { showResult(`<div class="empty">Erreur: ${esc(e.message)}</div>`); }
  finally { setBusy('detectBtn', false); }
}

async function initProject() {
  const p = projPath();
  if (!p) { showResult('<div class="empty">Entre un chemin de dossier d\'abord.</div>'); return; }
  const stack = state.selectedStack === 'auto' ? 'node' : state.selectedStack;
  setBusy('initBtn', true, 'Initialisation…');
  try {
    const res = await fetch('/api/project/init', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: p, stack })
    });
    const d = await res.json();
    if (d.error) { showResult(`<div class="empty">Erreur: ${esc(d.error)}</div>`); return; }
    const files = (d.created || []).map(f => `<span class="file-chip new">${esc(f)}</span>`).join('');
    const skipped = (d.skipped || []).map(f => `<span class="file-chip">${esc(f)}</span>`).join('');
    const cmds = Object.entries(d.commands || {}).filter(([, v]) => v).map(([, v]) => `
      <div class="cmd"><code>${esc(v)}</code><button class="copy-btn" onclick="copyText(this)">Copier</button></div>`).join('');
    showResult(`
      <h3>${d.stack.icon} Projet « ${esc(d.name)} » initialisé (${esc(d.stack.label)})</h3>
      <div class="ok-line">✓ ${d.created.length} fichier(s) créé(s)</div>
      <div class="file-list">${files}${skipped}</div>
      <div class="cmd-block"><div class="label">Commandes pour démarrer</div>${cmds}</div>`);
  } catch (e) { showResult(`<div class="empty">Erreur: ${esc(e.message)}</div>`); }
  finally { setBusy('initBtn', false); }
}

async function doctorProject() {
  const p = projPath();
  if (!p) { showResult('<div class="empty">Entre un chemin de dossier d\'abord.</div>'); return; }
  setBusy('doctorBtn', true, 'Diagnostic…');
  try {
    const res = await fetch(`/api/project/doctor?path=${encodeURIComponent(p)}`);
    const d = await res.json();
    const stackLabel = d.stack ? `${d.stack.icon} ${esc(d.stack.label)}` : '🤖 Aucune stack';
    const files = (d.files || []).map(f => `
      <tr><td>${f.exists ? '<span class="tag ok">OK</span>' : '<span class="tag miss">MANQUE</span>'}${esc(f.name)}</td>
      <td>${f.required ? 'requis' : 'optionnel'}</td></tr>`).join('');
    const recs = (d.recommendations || []).map(r => `
      <div class="rec"><span class="rtype ${r.type}">${r.type}</span>
      <span class="msg">${esc(r.message)}</span>
      ${r.action ? `<span class="act">${esc(r.action)}</span>` : ''}</div>`).join('');
    const conflicts = (d.conflicts || []).map(cf => `
      <div class="rec"><span class="rtype conflict">conflit</span><span class="msg">${esc(cf.message)}</span></div>`).join('');
    showResult(`
      <h3>🩺 Diagnostic : ${stackLabel}</h3>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr><th style="text-align:left;padding:6px 8px;color:var(--muted)">Fichier</th><th style="text-align:left;padding:6px 8px;color:var(--muted)">Statut</th></tr></thead>
        <tbody>${files}</tbody></table>
      ${conflicts ? `<div class="cmd-block"><div class="label">Conflits</div>${conflicts}</div>` : ''}
      ${recs ? `<div class="cmd-block"><div class="label">Recommandations</div>${recs}</div>` : '<div class="ok-line">✓ Aucun problème détecté.</div>'}`);
  } catch (e) { showResult(`<div class="empty">Erreur: ${esc(e.message)}</div>`); }
  finally { setBusy('doctorBtn', false); }
}

        <div class="logs">${(t.files || []).map(f => `
          <div class="log-file"><div class="log-file-label">${esc(f.label)}</div>
          ${(f.lines || []).map(l => `<div class="log-line ${classify(l)}">${esc(l)}</div>`).join('')}</div>`).join('') || '<div class="empty">Aucun log.</div>'}</div>
      </div>`).join('');
    openDetail('Capture complète', html);
  } catch (e) {
    openDetail('Capture complète', `<div class="empty">Erreur: ${esc(e.message)}</div>`);
  }
}

render();
</script>
</body>
</html>
